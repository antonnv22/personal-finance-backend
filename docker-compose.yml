# Прикладной стек: PostgreSQL + backend + frontend.
#
# Инфраструктура (Vault, Elasticsearch, Kibana, Logstash) живёт в отдельном
# файле backend/docker-compose.yaml и должна быть поднята ПЕРВОЙ — backend
# подключается к её сети backend_default, чтобы видеть vault и logstash по
# именам сервисов.
#
#   docker compose -f backend/docker-compose.yaml up -d   # инфраструктура
#   docker compose up -d --build                          # приложение

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_finance}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
    volumes:
      - pf-postgres-data:/var/lib/postgresql/data
    ports:
      # 5433 на хосте — локально установленный Postgres уже занимает 5432
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-personal_finance}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Vault и Logstash доступны по именам сервисов внутри сети backend_default
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:?VAULT_TOKEN не задан в .env}
      LOGSTASH_DESTINATION: logstash:5000

      # Переменные окружения имеют приоритет выше, чем spring.config.import: vault://,
      # поэтому здесь они перекрывают адрес БД из Vault (там он указывает на
      # localhost, что внутри контейнера означало бы сам контейнер).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-personal_finance}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET не задан в .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      # Группа readiness проверяет только БД: запечатанный Vault не должен
      # помечать работающее приложение как неготовое.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    networks:
      - app
      - infra

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    networks:
      - app

networks:
  app:
    driver: bridge
  infra:
    # Сеть, создаваемая backend/docker-compose.yaml (проект «backend»).
    external: true
    name: backend_default

volumes:
  pf-postgres-data:
