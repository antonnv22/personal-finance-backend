spring:
  application:
    name: personal-finance
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/personal_finance}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  config:
    # optional: приложение стартует и без Vault — например, в тестах или когда
    # параметры БД пришли переменными окружения (Docker). Без этого запечатанный
    # или выключенный Vault роняет запуск.
    import: optional:vault://
  cloud:
    vault:
      # localhost — для запуска из IDE; в Docker переопределяется на http://vault:8200
      uri: ${VAULT_URI:http://localhost:8200}
      authentication: TOKEN
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: secret
        application-name: personal-finance
  ai:
    mcp:
      server:
        enabled: true
        name: personal-finance
        version: 1.0.0
        type: SYNC
        instructions: "Финансовый MCP-сервер: логин и запрос баланса"
        capabilities:
          tool: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-at-least-256-bit-secret-key-here}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  scheduling:
    enabled: true
  recurring:
    # На сколько месяцев вперёд материализуются запланированные платежи.
    horizon-months: 12
    # Ежедневное пополнение горизонта планирования.
    generation-cron: "0 15 3 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always
      group:
        # Готовность обслуживать запросы = доступна БД. Индикатор Vault сюда
        # намеренно не входит: секреты читаются один раз при старте, и
        # запечатанный Vault не мешает работающему приложению отвечать.
        # На эту группу настроен healthcheck контейнера.
        readiness:
          include: db, ping

  metrics:
    tags:
      application: personal-finance

logging:
  level:
    org.springframework.security: INFO
    org.springframework.cloud.vault: DEBUG