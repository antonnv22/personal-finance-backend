services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - "8200:8200"
    volumes:
      - ./vault/config:/vault/config
      - vault-data:/vault/file
    cap_add:
      - IPC_LOCK
    command: vault server -config=/vault/config/vault.hcl

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Без явного лимита ES резервирует под heap половину всей памяти Docker
      # (~3.9 ГиБ из 7.7) и вытесняет остальные контейнеры — контейнер падал с OOM (код 137).
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    mem_limit: 2g
    restart: unless-stopped
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.3
    environment:
      - "LS_JAVA_OPTS=-Xms512m -Xmx512m"
    mem_limit: 1g
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - ./elk/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch

volumes:
  vault-data: